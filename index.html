<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Intelligent Incident & Service Desk Agent — Enterprise AI-driven ITSM automation platform" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Intelligent Incident Agent</title>
    <!--
      FLASH-FREE THEME INITIALIZATION
      ----------------------------------------------------
      This script runs synchronously BEFORE first paint to
      prevent the FOUC ("flash of unstyled content") effect
      where the page briefly shows the wrong theme.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('iia-theme');
          var systemDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || 'system';
          var resolved = theme === 'system' ? (systemDark ? 'dark' : 'light') : theme;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
